[project]
name = "aizen"
version = "0.1.0"
description = "A.I.Z.E.N. — Local Personal AI Operating Environment (Python core)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "structlog>=24.4",
    "openpyxl>=3.1",
    "watchfiles>=0.24",
    "PyYAML>=6.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "pyright>=1.1.390",
    "pytest-cov>=5.0",
    "python-semantic-release>=9.0",
    "syrupy>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core/aizen"]

[tool.hatch.build.targets.wheel.force-include]
"core/aizen/config" = "aizen/config"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["core/tests", ".venv", "protocol"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"core/aizen/**/__init__.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["core/aizen", "core/tests"]
exclude = ["core/tests/fixtures", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = true

[tool.pytest.ini_options]
testpaths = ["core/tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.coverage.run]
source = ["aizen"]